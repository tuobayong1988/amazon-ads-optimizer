# v358: CI质量门禁 - 防止回归和代码质量下降
name: CI Quality Gate

on:
  push:
    branches: [main, 'feature/**', 'hotfix/**']
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'

jobs:
  # ==================== 代码质量检查 ====================
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      
      # TypeScript类型检查
      - name: TypeScript Type Check
        run: npx tsc --noEmit --skipLibCheck 2>&1 | tee /tmp/tsc-output.txt || true
        
      # 检查是否有新增的 'any' 类型使用
      - name: Check for new 'any' type usage
        run: |
          ANY_COUNT=$(grep -rn ": any" server/ --include="*.ts" | grep -v "node_modules" | grep -v ".test.ts" | grep -v "__tests__" | wc -l)
          echo "Current 'any' type count: $ANY_COUNT"
          # v358基线: 2500+ any类型，逐步减少
          # 设置上限防止增长，每次迭代降低阈值
          ANY_THRESHOLD=2600
          if [ "$ANY_COUNT" -gt "$ANY_THRESHOLD" ]; then
            echo "::error::any类型使用数量($ANY_COUNT)超过阈值($ANY_THRESHOLD)，请减少any的使用"
            exit 1
          fi
          echo "✅ any类型使用数量($ANY_COUNT)在阈值($ANY_THRESHOLD)以内"

  # ==================== 单元测试 ====================
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      
      - name: Run Tests
        run: npx vitest run --reporter=verbose 2>&1 | tee /tmp/test-output.txt
        
      - name: Verify Test Count
        run: |
          # 确保测试数量不减少（防止删除测试来"修复"问题）
          PASS_COUNT=$(grep -oP '\d+ passed' /tmp/test-output.txt | head -1 | grep -oP '\d+')
          MIN_TESTS=919
          echo "Passed tests: $PASS_COUNT, Minimum required: $MIN_TESTS"
          if [ "$PASS_COUNT" -lt "$MIN_TESTS" ]; then
            echo "::error::通过的测试数量($PASS_COUNT)低于基线($MIN_TESTS)，不允许删除测试"
            exit 1
          fi
          echo "✅ 测试数量检查通过"

  # ==================== 安全扫描 ====================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # 检查硬编码凭证
      - name: Scan for hardcoded credentials
        run: |
          echo "扫描硬编码凭证..."
          ISSUES=0
          
          # 检查硬编码密码（排除测试文件和文档中的示例）
          if grep -rn "password.*=.*['\"]" server/ --include="*.ts" | grep -v ".test.ts" | grep -v "process.env" | grep -v "config\." | grep -v "interface\|type\|//" | head -5; then
            echo "::warning::发现可能的硬编码密码"
            ISSUES=$((ISSUES+1))
          fi
          
          # 检查硬编码AWS密钥
          if grep -rn "AKIA[0-9A-Z]" . --include="*.ts" --include="*.py" --include="*.sh" --include="*.md" | grep -v "node_modules" | head -5; then
            echo "::error::发现硬编码AWS Access Key"
            ISSUES=$((ISSUES+1))
          fi
          
          # 检查硬编码数据库连接字符串
          if grep -rn "mysql://.*:.*@" scripts/ server/ --include="*.ts" --include="*.py" | grep -v "process.env" | grep -v "example\|template" | head -5; then
            echo "::error::发现硬编码数据库连接字符串"
            ISSUES=$((ISSUES+1))
          fi
          
          if [ "$ISSUES" -gt 0 ]; then
            echo "::error::发现$ISSUES个安全问题，请修复后重新提交"
            exit 1
          fi
          echo "✅ 安全扫描通过"

  # ==================== 代码规模检查 ====================
  code-health:
    name: Code Health Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # 检查超大文件
      - name: Check for oversized files
        run: |
          echo "检查超大文件..."
          MAX_LINES=2000
          OVERSIZED=$(find server/ -name "*.ts" -not -path "*/node_modules/*" -exec wc -l {} + | sort -rn | awk -v max=$MAX_LINES '$1 > max {print}' | head -10)
          if [ -n "$OVERSIZED" ]; then
            echo "::warning::以下文件超过${MAX_LINES}行，建议拆分:"
            echo "$OVERSIZED"
          fi
          echo "✅ 代码规模检查完成"
      
      # 检查return 0静默失败模式
      - name: Check for silent failure patterns
        run: |
          echo "检查静默失败模式..."
          # 在catch块中return 0是危险模式
          SILENT_FAILURES=$(grep -rn "return 0" server/services/sync/ --include="*.ts" | grep -v "// 合法" | grep -v "报告数据为空" | grep -v "deprecated" | grep -v "不需要额外" | grep -v "没有新的" | wc -l)
          echo "sync模块中return 0数量: $SILENT_FAILURES"
          # 设置阈值，逐步减少
          THRESHOLD=15
          if [ "$SILENT_FAILURES" -gt "$THRESHOLD" ]; then
            echo "::warning::sync模块中return 0数量($SILENT_FAILURES)偏高，请检查是否有新增的静默失败"
          fi
          echo "✅ 静默失败检查完成"
