name: ID Safety Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  id-safety:
    name: ID Safety Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run ID Safety Check (strict mode)
        run: node scripts/check-id-safety.js --strict

  build:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: id-safety
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: npm run build
